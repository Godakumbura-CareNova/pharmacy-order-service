name: Pharmacy Order CD

on:
  push:
    branches:
      - main

jobs:
  docker:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deployment credentials
        id: deployment-credentials
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && \
             [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "docker_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker_configured=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub secrets are not fully configured; skipping Docker login and image push."
          fi

          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && \
             [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ] && \
             [ -n "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" ]; then
            echo "deploy_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_configured=false" >> "$GITHUB_OUTPUT"
            echo "Azure deployment secrets are not fully configured; skipping Azure deploy."
          fi

      - name: Log in to Docker Hub
        if: steps.deployment-credentials.outputs.docker_configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.deployment-credentials.outputs.docker_configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/carenova-pharmacy-order:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/carenova-pharmacy-order:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure Web App
        if: steps.deployment-credentials.outputs.deploy_configured == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'carenova-pharmacy-order'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: '${{ secrets.DOCKERHUB_USERNAME }}/carenova-pharmacy-order:${{ github.sha }}'